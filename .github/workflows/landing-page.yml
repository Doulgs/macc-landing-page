name: Landing page

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate the production build
        run: docker build .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: macc-landing-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and publish the image
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --push --platform linux/amd64 \
            --tag "$image:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_WHATSAPP_NUMBER \
            --metadata-file "$RUNNER_TEMP/image.json" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/image.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy to the VPS
        env:
          SSH_KEY: ${{ secrets.MACC_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.MACC_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.MACC_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$IMAGE_DIGEST" "$GITHUB_ACTOR" "$GHCR_TOKEN" |
            ssh -T -i "$ssh_dir/deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              "macc-deploy@$SSH_HOST"
