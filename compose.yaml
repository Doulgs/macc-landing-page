services:
  landing-page:
    image: ${MACC_IMAGE:?Set MACC_IMAGE to the image reference}
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/landing-page').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 8
      start_period: 5s
